<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unison Interactive Map</title>
<style>
  :root{
    --parchment:#f3e6c9;
    --ink:#3a2b1a;
    --gold:#c9962f;
    --purple:#6b4a8a;
    --purple-dark:#4a3363;
    --crimson:#a8433a;
    --teal:#2f8a86;
    --green:#4f7c3f;
    --card-bg:#fbf2dd;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#1c140c;font-family:Georgia,'Times New Roman',serif;}

  /* ============================================================
     EDIT ME: everything a non-developer needs to fill in lives in
     the LOCATIONS array near the bottom of this file, inside the
     <script> tag. Each entry has a "name" and "desc" field — just
     replace the placeholder text. Positions come straight from
     your icon sheet's own layout, so you shouldn't need to touch
     x / y / w / h.
     ============================================================ */

  #map-wrap{
    position:relative;
    width:100%;
    max-width:1100px;
    margin:0 auto;
    background:#1c140c;
  }
  #map-frame{
    position:relative;
    width:100%;
    aspect-ratio:2005/2552; /* locked to the background image's native size */
    overflow:hidden;
  }
  #map-frame img.bg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
  }

  .hotspot{
    position:absolute;
    z-index:2;
    cursor:pointer;
  }
  .hotspot img.piece{
    display:block;
    width:100%;
    height:100%;
    object-fit:contain;
    filter:drop-shadow(0 2px 4px rgba(0,0,0,.35));
    transition:filter .15s ease, transform .15s ease;
    transform-origin:center bottom;
  }
  .hotspot:hover img.piece,
  .hotspot.active img.piece{
    transform:scale(1.06);
    filter:drop-shadow(0 4px 10px rgba(0,0,0,.55)) brightness(1.08);
  }
  .hotspot:hover,
  .hotspot.active{
    z-index:5;
  }

  .ring{
    position:absolute;
    inset:-6%;
    border-radius:14px;
    border:2px solid transparent;
    opacity:0;
    transition:opacity .15s ease;
    pointer-events:none;
  }
  .hotspot:hover .ring, .hotspot.active .ring{ opacity:.85; }
  .cat-market .ring{ border-color:var(--gold); }
  .cat-stage .ring{ border-color:var(--crimson); }
  .cat-play .ring{ border-color:var(--teal); }
  .cat-sanctuary .ring{ border-color:var(--purple); }
  .cat-amenity .ring{ border-color:var(--green); }

  .card{
    position:absolute;
    bottom:calc(100% + 8px);
    left:50%;
    transform:translateX(-50%) scale(.92);
    width:max-content;
    max-width:min(260px, 55vw);
    background:var(--card-bg);
    border:2px solid var(--gold);
    border-radius:10px;
    padding:8px 12px 10px;
    box-shadow:0 8px 24px rgba(0,0,0,.5);
    opacity:0;
    pointer-events:none;
    transition:opacity .15s ease, transform .15s ease;
    text-align:left;
  }
  .hotspot:hover .card, .hotspot.active .card{
    opacity:1;
    transform:translateX(-50%) scale(1);
    pointer-events:auto;
  }
  .card h3{
    margin:0 0 4px;
    font-size:14px;
    color:var(--purple-dark);
    line-height:1.2;
  }
  .card p{
    margin:0;
    font-size:12px;
    line-height:1.4;
    color:var(--ink);
  }
  .card .cat-label{
    display:block;
    font-size:9.5px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--gold);
    margin-top:5px;
    font-weight:bold;
  }

  .legend{
    max-width:1100px;
    margin:14px auto 30px;
    padding:12px 16px;
    background:#241a10;
    border:1px solid #4a3320;
    border-radius:10px;
    display:flex;
    flex-wrap:wrap;
    gap:10px 20px;
    justify-content:center;
  }
  .legend span{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:13px;
    color:var(--parchment);
    font-family:Georgia,serif;
  }
  .legend i{
    width:12px;height:12px;border-radius:50%;display:inline-block;
  }
  .legend .cat-market i{background:var(--gold);}
  .legend .cat-stage i{background:var(--crimson);}
  .legend .cat-play i{background:var(--teal);}
  .legend .cat-sanctuary i{background:var(--purple);}
  .legend .cat-amenity i{background:var(--green);}
</style>
</head>
<body>

<div id="map-wrap">
  <div id="map-frame">
    <img class="bg" src="bg.jpg" alt="Unison site map">
    <!-- hotspots injected by JS -->
  </div>
</div>

<div class="legend">
  <span class="cat-stage"><i></i>Stage &amp; Performance</span>
  <span class="cat-market"><i></i>Market &amp; Food</span>
  <span class="cat-sanctuary"><i></i>Sanctuary &amp; Art</span>
  <span class="cat-play"><i></i>Play</span>
  <span class="cat-amenity"><i></i>Amenities</span>
</div>

<script>

   Just replace "name" and "desc" for each — everything else can
   stay as-is.
   ============================================================ */

  { icon:"cream_tents_cluster.png", x:88.379, y:18.417, w:11.621, h:9.483, cat:"market", name:"[Market Tents]", desc:"Add a description." },
  { icon:"goddess_egg_statue.png", x:74.115, y:12.97, w:10.374, h:8.229, cat:"sanctuary", name:"[Goddess Statue]", desc:"Add a description." },
  { icon:"blue_slide.png", x:31.671, y:18.456, w:9.576, h:9.992, cat:"play", name:"[Slide]", desc:"Add a description." },

  { icon:"purple_market_stall.png", x:73.965, y:25.862, w:12.718, h:6.074, cat:"market", name:"[Vendor Stall]", desc:"Add a description." },

  { icon:"purple_poncho.png", x:60.349, y:36.834, w:7.581, h:7.249, cat:"market", name:"[Clothing Vendor]", desc:"Add a description." },
  { icon:"marigold_flower.png", x:76.608, y:35.658, w:7.781, h:6.975, cat:"sanctuary", name:"[Marigold Patch]", desc:"Add a description." },
  { icon:"signup_chalkboard.png", x:31.072, y:42.79, w:4.738, h:6.348, cat:"market", name:"[Sign-Up Board]", desc:"Add a description." },

  { icon:"flying_carpet.png", x:62.843, y:45.024, w:12.818, h:6.23, cat:"stage", name:"[Flying Carpet]", desc:"Add a description." },
  { icon:"watchtower_stage.png", x:61.347, y:48.158, w:18.105, h:15.4, cat:"stage", name:"[Main Stage]", desc:"Add a description." },
  { icon:"restroom.png", x:1.446, y:55.368, w:9.526, h:6.779, cat:"amenity", name:"[Restrooms]", desc:"Add a description." },

  { icon:"portal_doors_column.png", x:92.868, y:57.328, w:7.132, h:24.255, cat:"sanctuary", name:"[Portal Doors]", desc:"Add a description." },
  { icon:"purple_pavilion.png", x:2.344, y:63.754, w:13.566, h:9.404, cat:"sanctuary", name:"[Pavilion]", desc:"Add a description." },
  { icon:"sun_orb_sculpture.png", x:22.244, y:63.205, w:7.88, h:6.936, cat:"sanctuary", name:"[Sun Orb]", desc:"Add a description." },

  { icon:"canopy_lounge.png", x:1.297, y:72.61, w:10.973, h:8.464, cat:"sanctuary", name:"[Chill Lounge]", desc:"Add a description." },
  { icon:"puzzle_cube.png", x:20.0, y:71.669, w:8.878, h:6.975, cat:"sanctuary", name:"[Puzzle Cube]", desc:"Add a description." },
  { icon:"dark_ceremony_yurt.png", x:66.085, y:77.351, w:13.965, h:11.755, cat:"sanctuary", name:"[Ceremony Tent]", desc:"Add a description." },
  { icon:"eye_sculpture.png", x:18.454, y:79.428, w:10.823, h:6.975, cat:"sanctuary", name:"[Eye Sculpture]", desc:"Add a description." },
  { icon:"wizard_portal.png", x:13.117, y:86.089, w:12.618, h:9.326, cat:"sanctuary", name:"[Portal]", desc:"Add a description." },
  { icon:"sports_court.png", x:0.549, y:86.403, w:12.17, h:11.951, cat:"amenity", name:"[Sports Court]", desc:"Add a description." },
];

const CAT_LABELS = {
  market:"Market & Food", stage:"Stage & Performance", play:"Play",
  sanctuary:"Sanctuary & Art", amenity:"Amenities"
};

const frame = document.getElementById("map-frame");

LOCATIONS.forEach((loc) => {
  const hs = document.createElement("div");
  hs.className = `hotspot cat-${loc.cat}`;
  hs.style.left = loc.x + "%";
  hs.style.top = loc.y + "%";
  hs.style.width = loc.w + "%";
  hs.style.height = loc.h + "%";

  hs.innerHTML = `
    <div class="ring"></div>
    <img class="piece" src="icons/${loc.icon}" alt="${loc.name}">
    <div class="card">
      <h3>${loc.name}</h3>
      <p>${loc.desc}</p>
      <span class="cat-label">${CAT_LABELS[loc.cat]}</span>
    </div>
  `;

  hs.addEventListener("click", () => {
    const isActive = hs.classList.contains("active");
    document.querySelectorAll(".hotspot.active").forEach(p => p.classList.remove("active"));
    if (!isActive) hs.classList.add("active");
  });

  frame.appendChild(hs);
});

document.addEventListener("click", (e) => {
  if (!e.target.closest(".hotspot")) {
    document.querySelectorAll(".hotspot.active").forEach(p => p.classList.remove("active"));
  }
});
</script>

</body>
</html>
