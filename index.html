<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unison Interactive Map</title>
<style>
  :root{
    --parchment:#f3e6c9;
    --ink:#3a2b1a;
    --gold:#c9962f;
    --purple:#6b4a8a;
    --purple-dark:#4a3363;
    --crimson:#a8433a;
    --teal:#2f8a86;
    --green:#4f7c3f;
    --card-bg:#fbf2dd;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#1c140c;font-family:Georgia,'Times New Roman',serif;}

  /* ============================================================
     EDIT ME: everything a non-developer needs to fill in lives in
     the LOCATIONS array near the bottom of this file, inside the
     <script> tag. Each entry has a "name" and "desc" field — just
     replace the placeholder text.

     To reposition/resize icons visually instead of by hand: open
     this page with  ?edit  on the end of the URL (e.g.
     yoursite.github.io/unison-map/?edit), drag icons around, drag
     their bottom-right handle to resize, then click "Export" in
     the toolbar that appears — it gives you code to paste back
     into this file in place of the matching block. The ?edit
     toolbar never shows up for normal visitors or the WordPress
     embed.
     ============================================================ */

  #map-wrap{
    position:relative;
    width:100%;
    max-width:1100px;
    margin:0 auto;
    background:#1c140c;
  }
  #map-frame{
    position:relative;
    width:100%;
    aspect-ratio:1080/1456; /* locked to the background image's native size */
    overflow:hidden;
  }
  #map-frame img.bg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
    -webkit-user-drag:none;
    user-select:none;
  }

  .hotspot, .decor{
    position:absolute;
    z-index:2;
    cursor:pointer;
    touch-action:none;
  }
  .hotspot img.piece, .decor img.piece{
    display:block;
    width:100%;
    height:100%;
    object-fit:contain;
    filter:drop-shadow(0 2px 4px rgba(0,0,0,.35));
    transition:filter .15s ease, transform .15s ease;
    transform-origin:center bottom;
    -webkit-user-drag:none;
    user-select:none;
    pointer-events:none;
  }
  .decor.deco-arrow img.piece{ transform-origin:center center; }
  .hotspot:hover img.piece,
  .hotspot.active img.piece{
    transform:scale(1.06);
    filter:drop-shadow(0 4px 10px rgba(0,0,0,.55)) brightness(1.08);
  }
  .hotspot:hover, .hotspot.active{ z-index:5; }
  .hotspot.flash .ring{
    opacity:1 !important;
    animation:flash-pulse 1.1s ease-out 2;
  }
  @keyframes flash-pulse{
    0%{ box-shadow:0 0 0 0 rgba(255,255,255,.9); }
    100%{ box-shadow:0 0 0 18px rgba(255,255,255,0); }
  }

  .ring{
    position:absolute;
    inset:-6%;
    border-radius:14px;
    border:2px solid transparent;
    opacity:0;
    transition:opacity .15s ease;
    pointer-events:none;
  }
  .hotspot:hover .ring, .hotspot.active .ring{ opacity:.85; }
  .cat-market .ring{ border-color:var(--gold); }
  .cat-stage .ring{ border-color:var(--crimson); }
  .cat-play .ring{ border-color:var(--teal); }
  .cat-sanctuary .ring{ border-color:var(--purple); }
  .cat-amenity .ring{ border-color:var(--green); }

  .card{
    position:absolute;
    bottom:calc(100% + 8px);
    left:50%;
    transform:translateX(-50%) scale(.92);
    width:max-content;
    max-width:min(260px, 55vw);
    background:var(--card-bg);
    border:2px solid var(--gold);
    border-radius:10px;
    padding:8px 12px 10px;
    box-shadow:0 8px 24px rgba(0,0,0,.5);
    opacity:0;
    pointer-events:none;
    transition:opacity .15s ease, transform .15s ease;
    text-align:left;
  }
  .hotspot:hover .card, .hotspot.active .card{
    opacity:1;
    transform:translateX(-50%) scale(1);
    pointer-events:auto;
  }
  .card h3{ margin:0 0 4px; font-size:14px; color:var(--purple-dark); line-height:1.2; }
  .card p{ margin:0; font-size:12px; line-height:1.4; color:var(--ink); }
  .card .cat-label{
    display:block; font-size:9.5px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--gold); margin-top:5px; font-weight:bold;
  }

  .logo-anim img.piece{ animation:logo-float 6s ease-in-out infinite; }
  @keyframes logo-float{
    0%,100%{ transform:translate(0,0) rotate(0deg); }
    25%{ transform:translate(3%,-6%) rotate(4deg); }
    50%{ transform:translate(-2%,-2%) rotate(-3deg); }
    75%{ transform:translate(2%,4%) rotate(2deg); }
  }
  .decor.deco-logo img.piece{ filter:drop-shadow(0 4px 10px rgba(0,0,0,.45)); }

  /* arrow: gentle bob (on the wrapper, so it doesn't fight the flip/rotate transform
     on the image) plus a pulsing glow (on filter only, same reason). */
  .decor.deco-arrow{ animation:arrow-bob 2.2s ease-in-out infinite; }
  .decor.deco-arrow img.piece{ animation:arrow-glow 2.2s ease-in-out infinite; }
  @keyframes arrow-bob{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-10%); }
  }
  @keyframes arrow-glow{
    0%,100%{ filter:drop-shadow(0 3px 6px rgba(0,0,0,.5)) drop-shadow(0 0 4px rgba(255,214,120,.35)); }
    50%{ filter:drop-shadow(0 3px 6px rgba(0,0,0,.5)) drop-shadow(0 0 16px rgba(255,214,120,.95)); }
  }

  /* every map pin: a small, staggered "dancy" bump so the map feels alive */
  .hotspot{ animation:icon-bump 1.7s ease-in-out infinite; animation-delay:var(--bump-delay, 0s); }
  @keyframes icon-bump{
    0%,100%{ transform:translateY(0) scale(1); }
    50%{ transform:translateY(-5%) scale(1.035); }
  }

  /* ---------- edit mode ---------- */
  body.editing .hotspot,
  body.editing .decor{ cursor:move; }
  body.editing .hotspot,
  body.editing .decor.deco-arrow{ animation-play-state:paused; }
  body.editing .hotspot .card{ display:none; } /* keep cards out of the way while editing */
  body.editing .hotspot .ring,
  body.editing .decor .ring{
    opacity:.9; border-style:dashed; border-color:rgba(255,255,255,.85);
  }
  .edit-outline{
    position:absolute; inset:0; pointer-events:none; display:none;
  }
  body.editing .edit-outline{ display:block; outline:1px dashed rgba(255,255,255,.5); outline-offset:2px; }
  .selected .edit-outline{ outline:2px solid #fff !important; }

  .resize-handle{
    position:absolute;
    right:-7px; bottom:-7px;
    width:14px; height:14px;
    border-radius:50%;
    background:#fff;
    border:2px solid var(--gold);
    display:none;
    cursor:nwse-resize;
    z-index:10;
    touch-action:none;
  }
  body.editing .hotspot .resize-handle,
  body.editing .decor .resize-handle{ display:block; }

  .toolbar{
    display:none;
    position:sticky;
    top:0;
    z-index:50;
    background:#241a10;
    border-bottom:2px solid var(--gold);
    padding:10px 14px;
    gap:10px;
    align-items:center;
    flex-wrap:wrap;
    font-family:Georgia,serif;
    color:var(--parchment);
  }
  body.edit-available .toolbar{ display:flex; }
  .toolbar button{
    background:var(--purple);
    color:#fff;
    border:1px solid var(--purple-dark);
    padding:6px 12px;
    border-radius:6px;
    cursor:pointer;
    font-size:13px;
    font-family:Georgia,serif;
  }
  .toolbar button:hover{ filter:brightness(1.15); }
  .toolbar button.primary{ background:var(--gold); color:#2a1c08; border-color:#8a6a1f; font-weight:bold; }
  .toolbar label{ font-size:13px; display:flex; align-items:center; gap:6px; }
  .toolbar .sel-info{ font-size:12px; color:#cbb98a; margin-left:auto; }
  .toolbar .rotate-box{ display:none; align-items:center; gap:6px; }
  .toolbar .rotate-box.show{ display:flex; }
  .toolbar .rotate-box input[type=range]{ width:140px; }

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.6);
    display:none; align-items:center; justify-content:center; z-index:100; padding:20px;
  }
  .modal-backdrop.show{ display:flex; }
  .modal{
    background:var(--card-bg); border:2px solid var(--gold); border-radius:10px;
    max-width:700px; width:100%; max-height:80vh; display:flex; flex-direction:column;
    padding:16px;
  }
  .modal h3{ margin:0 0 8px; color:var(--purple-dark); }
  .modal textarea{
    flex:1; min-height:300px; font-family:Menlo,Consolas,monospace; font-size:12px;
    padding:10px; border:1px solid #c9b98a; border-radius:6px; resize:vertical;
  }
  .modal .modal-actions{ display:flex; gap:10px; margin-top:10px; justify-content:flex-end; }

  /* ---------- key menu (toggle, top-right of the map) ---------- */
  .key-toggle-btn{
    position:absolute;
    top:2.5%; right:2.5%;
    z-index:30;
    background:#241a10ee;
    color:var(--parchment);
    border:2px solid var(--gold);
    border-radius:999px;
    padding:8px 16px;
    font-family:Georgia,serif;
    font-size:clamp(11px,2.6vw,14px);
    font-weight:bold;
    letter-spacing:.03em;
    cursor:pointer;
    box-shadow:0 3px 10px rgba(0,0,0,.5);
    display:flex; align-items:center; gap:6px;
  }
  .key-toggle-btn:hover{ background:#2f2213ee; }
  .key-toggle-btn .chev{ transition:transform .2s ease; display:inline-block; }
  .key-panel.open ~ .key-toggle-btn .chev,
  .key-toggle-btn.open .chev{ transform:rotate(180deg); }

  .key-panel{
    position:absolute;
    top:calc(2.5% + 42px);
    right:2.5%;
    z-index:29;
    width:min(320px, 62vw);
    max-height:min(70%, 560px);
    overflow-y:auto;
    padding:14px 14px 16px;
    background:#1c140fee;
    border:2px solid var(--gold);
    border-radius:12px;
    color:var(--parchment);
    font-family:Georgia,serif;
    box-shadow:0 10px 30px rgba(0,0,0,.6);
    transform-origin:top right;
    opacity:0;
    transform:scale(.92) translateY(-6px);
    pointer-events:none;
    transition:opacity .16s ease, transform .16s ease;
  }
  .key-panel.open{
    opacity:1;
    transform:scale(1) translateY(0);
    pointer-events:auto;
  }
  .key-panel h2{
    margin:0 0 10px; font-size:15px; color:var(--gold); text-align:center;
    letter-spacing:.03em;
  }
  .key-group{ margin-bottom:12px; }
  .key-group:last-child{ margin-bottom:0; }
  .key-group-title{
    display:flex; align-items:center; gap:8px;
    font-size:11.5px; text-transform:uppercase; letter-spacing:.06em;
    color:#cbb98a; margin-bottom:6px; padding-bottom:4px;
    border-bottom:1px solid #4a3320;
  }
  .key-group-title i{ width:9px; height:9px; border-radius:50%; display:inline-block; flex-shrink:0; }
  .key-list{ display:flex; flex-direction:column; gap:5px; }
  .key-item{
    display:flex; align-items:center; gap:8px;
    background:#2f2213; border:1px solid #4a3320; border-radius:8px;
    padding:4px 7px; cursor:pointer; text-align:left;
    font-family:Georgia,serif; color:var(--parchment); font-size:12.5px;
    width:100%;
  }
  .key-item:hover{ background:#3a2a17; border-color:var(--gold); }
  .key-item img{ width:24px; height:24px; object-fit:contain; flex-shrink:0; }
</style>
</head>
<body>

<div class="toolbar">
  <button id="btn-toggle-edit">Editing: Off</button>
  <button id="btn-reset">Reload (keep saved layout)</button>
  <button id="btn-clear">Clear saved layout</button>
  <button id="btn-export" class="primary">Export layout</button>
  <div class="rotate-box" id="rotate-box">
    <label>Rotate: <input type="range" id="rotate-slider" min="0" max="359" value="0"></label>
    <span id="rotate-readout">0°</span>
  </div>
  <span class="sel-info" id="sel-info">Drag an icon to move it. Drag its white dot to resize.</span>
</div>

<div id="map-wrap">
  <div id="map-frame">
    <img class="bg" src="bg.jpg" alt="Unison site map">
    <!-- hotspots + decor injected by JS -->
  </div>

  <button class="key-toggle-btn" id="key-toggle-btn">Map Key <span class="chev">&#9660;</span></button>
  <div class="key-panel" id="key-panel">
    <h2>Map Key</h2>
    <div id="key-groups"></div>
  </div>
</div>

<div class="modal-backdrop" id="export-modal">
  <div class="modal">
    <h3>Updated layout code</h3>
    <p style="margin:0 0 8px;font-size:13px;">Copy this and paste it over the matching block(s) in <code>index.html</code>, then commit &amp; push.</p>
    <textarea id="export-text" readonly></textarea>
    <div class="modal-actions">
      <button id="btn-copy">Copy to clipboard</button>
      <button id="btn-close-export">Close</button>
    </div>
  </div>
</div>

/* Decorative, non-informational pieces (no hover card, no key entry). */
const DECOR = [
  { id:"arrow", icon:"arrow.png", x:64.346, y:24.258, w:5.328, h:4.352, rot:55, flip:true },
  { id:"logo",  icon:"logo.png",  x:46.144, y:17.137, w:7.992, h:7.121, rot:0 },
];

const CAT_ORDER = ["stage","market","sanctuary","play","amenity"];
const CAT_LABELS = {
  market:"Market & Food", stage:"Stage & Performance", play:"Play",
  sanctuary:"Sanctuary & Art", amenity:"Amenities"
};

const frame = document.getElementById("map-frame");
const params = new URLSearchParams(location.search);
const editAvailable = params.has("edit");
if (editAvailable) document.body.classList.add("edit-available");

let selected = null; // currently selected element in edit mode, for resize/rotate

function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

/* ============================================================
   Persistence: dragged/resized/rotated positions are saved to this
   browser's localStorage automatically, so they survive a reload
   on this device. That does NOT push the change to other visitors
   — for that, use "Export layout" in the ?edit toolbar and paste
   the result over the LOCATIONS / DECOR arrays above, then publish.
   ============================================================ */
const STORAGE_KEY = "unisonMapLayout_v1";

function loadSavedLayout(){
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); }
  catch(err){ return {}; }
}
function saveLayout(){
  const data = { locations:{}, decor:{} };
  LOCATIONS.forEach(l => { data.locations[l._id] = { x:l.x, y:l.y, w:l.w, h:l.h }; });
  DECOR.forEach(d => { data.decor[d.id] = { x:d.x, y:d.y, w:d.w, h:d.h, rot:d.rot||0 }; });
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(err){}
}

LOCATIONS.forEach((loc, i) => { loc._id = i; });
const savedLayout = loadSavedLayout();
LOCATIONS.forEach(loc => {
  const s = savedLayout.locations && savedLayout.locations[loc._id];
  if (s) Object.assign(loc, s);
});
DECOR.forEach(d => {
  const s = savedLayout.decor && savedLayout.decor[d.id];
  if (s) Object.assign(d, s);
});

function attachDragResize(el, data, opts){
  const handle = el.querySelector(".resize-handle");

  el.addEventListener("pointerdown", (e) => {
    if (!document.body.classList.contains("editing")) return;
    if (e.target === handle) return;
    e.preventDefault();
    selectElement(el, data, opts);
    try { el.setPointerCapture(e.pointerId); } catch(err){}
    const rect = frame.getBoundingClientRect();
    const startX = e.clientX, startY = e.clientY;
    const startLeft = data.x, startTop = data.y;

    function onMove(ev){
      const dxPct = (ev.clientX - startX) / rect.width * 100;
      const dyPct = (ev.clientY - startY) / rect.height * 100;
      data.x = clamp(startLeft + dxPct, -2, 100);
      data.y = clamp(startTop + dyPct, -2, 100);
      el.style.left = data.x + "%";
      el.style.top = data.y + "%";
    }
    function onUp(ev){
      try { el.releasePointerCapture(ev.pointerId); } catch(err){}
      document.removeEventListener("pointermove", onMove);
      document.removeEventListener("pointerup", onUp);
      saveLayout();
    }
    document.addEventListener("pointermove", onMove);
    document.addEventListener("pointerup", onUp);
  });

  if (handle){
    handle.addEventListener("pointerdown", (e) => {
      if (!document.body.classList.contains("editing")) return;
      e.preventDefault();
      e.stopPropagation();
      selectElement(el, data, opts);
      try { handle.setPointerCapture(e.pointerId); } catch(err){}
      const rect = frame.getBoundingClientRect();
      const anchorX = rect.left + (data.x / 100) * rect.width;
      const anchorY = rect.top + (data.y / 100) * rect.height;
      const diag0 = Math.max(1, Math.hypot(e.clientX - anchorX, e.clientY - anchorY));
      const startW = data.w, startH = data.h;

      function onMove(ev){
        const diag1 = Math.hypot(ev.clientX - anchorX, ev.clientY - anchorY);
        const factor = diag1 / diag0;
        data.w = clamp(startW * factor, 1.5, 45);
        data.h = clamp(startH * factor, 1.5, 60);
        el.style.width = data.w + "%";
        el.style.height = data.h + "%";
      }
      function onUp(ev){
        try { handle.releasePointerCapture(ev.pointerId); } catch(err){}
        document.removeEventListener("pointermove", onMove);
        document.removeEventListener("pointerup", onUp);
        saveLayout();
      }
      document.addEventListener("pointermove", onMove);
      document.addEventListener("pointerup", onUp);
    });
  }
}

function selectElement(el, data, opts){
  document.querySelectorAll(".selected").forEach(n => n.classList.remove("selected"));
  el.classList.add("selected");
  selected = { el, data, opts };
  const rotBox = document.getElementById("rotate-box");
  const slider = document.getElementById("rotate-slider");
  const readout = document.getElementById("rotate-readout");
  const info = document.getElementById("sel-info");
  if (opts.rotatable){
    rotBox.classList.add("show");
    slider.value = data.rot || 0;
    readout.textContent = (data.rot||0) + "°";
  } else {
    rotBox.classList.remove("show");
  }
  info.textContent = `Selected: ${opts.label || data.icon}`;
}

document.getElementById("rotate-slider").addEventListener("input", (e) => {
  if (!selected || !selected.opts.rotatable) return;
  selected.data.rot = parseInt(e.target.value, 10);
  document.getElementById("rotate-readout").textContent = selected.data.rot + "°";
  const img = selected.el.querySelector("img.piece");
  img.style.transform = `${selected.opts.flip ? "scaleX(-1) " : ""}rotate(${selected.data.rot}deg)`;
});
document.getElementById("rotate-slider").addEventListener("change", () => {
  if (!selected || !selected.opts.rotatable) return;
  saveLayout();
});

// ---- build hotspots ----
LOCATIONS.forEach((loc, i) => {
  const hs = document.createElement("div");
  hs.className = `hotspot cat-${loc.cat}`;
  hs.dataset.id = i;
  hs.style.left = loc.x + "%";
  hs.style.top = loc.y + "%";
  hs.style.width = loc.w + "%";
  hs.style.height = loc.h + "%";
  hs.style.setProperty("--bump-delay", ((i * 0.37) % 1.7) + "s");

  hs.innerHTML = `
    <div class="ring"></div>
    <div class="edit-outline"></div>
    <img class="piece" src="icons/${loc.icon}" alt="${loc.name}">
    <div class="card">
      <h3>${loc.name}</h3>
      <p>${loc.desc}</p>
      <span class="cat-label">${CAT_LABELS[loc.cat]}</span>
    </div>
    <div class="resize-handle"></div>
  `;

  hs.addEventListener("click", (e) => {
    if (document.body.classList.contains("editing")) return;
    const isActive = hs.classList.contains("active");
    document.querySelectorAll(".hotspot.active").forEach(p => p.classList.remove("active"));
    if (!isActive) hs.classList.add("active");
  });

  frame.appendChild(hs);
  attachDragResize(hs, loc, { rotatable:false, label:loc.name });
});

document.addEventListener("click", (e) => {
  if (document.body.classList.contains("editing")) return;
  if (!e.target.closest(".hotspot")) {
    document.querySelectorAll(".hotspot.active").forEach(p => p.classList.remove("active"));
  }
});

// ---- build decor (arrow, logo) ----
DECOR.forEach((d) => {
  const el = document.createElement("div");
  el.className = `decor deco-${d.id}` + (d.id === "logo" ? " logo-anim" : "");
  el.style.left = d.x + "%";
  el.style.top = d.y + "%";
  el.style.width = d.w + "%";
  el.style.height = d.h + "%";
  el.innerHTML = `
    <div class="ring"></div>
    <div class="edit-outline"></div>
    <img class="piece" src="icons/${d.icon}" alt="" style="transform:${d.flip ? "scaleX(-1) " : ""}rotate(${d.rot||0}deg);">
    <div class="resize-handle"></div>
  `;
  frame.appendChild(el);
  attachDragResize(el, d, { rotatable: d.id === "arrow", label: d.id, flip: !!d.flip });
});

// ---- toolbar wiring ----
document.getElementById("btn-toggle-edit").addEventListener("click", (e) => {
  const on = document.body.classList.toggle("editing");
  e.target.textContent = "Editing: " + (on ? "On" : "Off");
  document.querySelectorAll(".hotspot.active").forEach(p => p.classList.remove("active"));
});
document.getElementById("btn-reset").addEventListener("click", () => location.reload());
document.getElementById("btn-clear").addEventListener("click", () => {
  if (confirm("Clear this browser's saved drag/resize edits and revert to the code defaults?")) {
    try { localStorage.removeItem(STORAGE_KEY); } catch(err){}
    location.reload();
  }
});

function fmt(n){ return Math.round(n * 1000) / 1000; }

document.getElementById("btn-export").addEventListener("click", () => {
  let out = "// ---- replace the existing `const LOCATIONS = [ ... ];` block with this ----\nconst LOCATIONS = [\n";
  LOCATIONS.forEach(loc => {
    out += `  { icon:"${loc.icon}", x:${fmt(loc.x)}, y:${fmt(loc.y)}, w:${fmt(loc.w)}, h:${fmt(loc.h)}, cat:"${loc.cat}", name:"${loc.name.replace(/"/g,'\\"')}", desc:"${loc.desc.replace(/"/g,'\\"')}" },\n`;
  });
  out += "];\n\n// ---- replace the existing `const DECOR = [ ... ];` block with this ----\nconst DECOR = [\n";
  DECOR.forEach(d => {
    out += `  { id:"${d.id}", icon:"${d.icon}", x:${fmt(d.x)}, y:${fmt(d.y)}, w:${fmt(d.w)}, h:${fmt(d.h)}, rot:${fmt(d.rot||0)}${d.flip ? ", flip:true" : ""} },\n`;
  });
  out += "];\n";
  document.getElementById("export-text").value = out;
  document.getElementById("export-modal").classList.add("show");
});
document.getElementById("btn-close-export").addEventListener("click", () => {
  document.getElementById("export-modal").classList.remove("show");
});
document.getElementById("btn-copy").addEventListener("click", () => {
  const ta = document.getElementById("export-text");
  ta.select();
  navigator.clipboard.writeText(ta.value).catch(()=>{});
});

// ---- map key ----
const keyPanelEl = document.getElementById("key-panel");
const keyToggleBtn = document.getElementById("key-toggle-btn");
function openKeyPanel(){ keyPanelEl.classList.add("open"); keyToggleBtn.classList.add("open"); }
function closeKeyPanel(){ keyPanelEl.classList.remove("open"); keyToggleBtn.classList.remove("open"); }
keyToggleBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  keyPanelEl.classList.contains("open") ? closeKeyPanel() : openKeyPanel();
});
document.addEventListener("click", (e) => {
  if (keyPanelEl.classList.contains("open") && !e.target.closest(".key-panel") && !e.target.closest(".key-toggle-btn")) {
    closeKeyPanel();
  }
});

const keyGroupsEl = document.getElementById("key-groups");
CAT_ORDER.forEach(cat => {
  const items = LOCATIONS.filter(l => l.cat === cat);
  if (!items.length) return;
  const group = document.createElement("div");
  group.className = "key-group";
  group.innerHTML = `<div class="key-group-title cat-${cat}"><i></i>${CAT_LABELS[cat]}</div>`;
  const list = document.createElement("div");
  list.className = "key-list";
  items.forEach(loc => {
    const btn = document.createElement("button");
    btn.className = "key-item";
    btn.innerHTML = `<img src="icons/${loc.icon}" alt=""><span>${loc.name}</span>`;
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const hs = frame.querySelector(`.hotspot[data-id="${loc._id}"]`);
      if (!hs) return;
      closeKeyPanel();
      document.getElementById("map-wrap").scrollIntoView({ behavior:"smooth", block:"center" });
      document.querySelectorAll(".hotspot.active").forEach(p => p.classList.remove("active"));
      hs.classList.add("active");
      hs.classList.remove("flash"); void hs.offsetWidth; hs.classList.add("flash");
      setTimeout(() => hs.classList.remove("flash"), 2300);
    });
    list.appendChild(btn);
  });
  group.appendChild(list);
  keyGroupsEl.appendChild(group);
});

// key group title swatch colors (reuses .ring color vars via border, simplest: inline)
document.querySelectorAll(".key-group-title i").forEach(i => {
  const cat = i.parentElement.className.match(/cat-(\w+)/)[1];
  const colors = { market:"var(--gold)", stage:"var(--crimson)", play:"var(--teal)", sanctuary:"var(--purple)", amenity:"var(--green)" };
  i.style.background = colors[cat] || "#999";
});
